name: Continuous Delivery / Promote Image

on:
  repository_dispatch:
    types: [image-pushed]

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mini-cicd Repo (to get scripts)
        uses: actions/checkout@v4

      - name: Setup SSH Key for GitOps Repo Access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITOPS_SSH_PRIVATE_KEY }}

      - name: Run Promotion Script
        run: |
          chmod +x ./scripts/promote.sh
          
          # Print full event JSON for debugging visibility in logs
          echo "Printing full GitHub event payload:"
          echo '${{ toJSON(github.event) }}'
          
          # Extract values sent from the mini-api payload
          TAG="${{ github.event.client_payload.tag }}"
          ENV="${{ github.event.client_payload.environment }}"
          
          echo "Received dispatch for version: '$TAG' targeting environment: '$ENV'"
          
          # Fallback check: if tag is empty, let's fail gracefully with context
          if [ -z "$TAG" ] || [ "$TAG" == "null" ]; then
            echo "Error: TAG payload is empty or missing!"
            echo "Check the JSON payload printed above to see what was received."
            exit 1
          fi
          
          # Execute the promotion script
          ./scripts/promote.sh "$TAG" "$ENV"